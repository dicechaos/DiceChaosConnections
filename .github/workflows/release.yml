name: Build & Publish Beta Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: --win
            asset_globs: |
              dist/*.exe
              dist/*.zip
              dist/latest*.yml
          - os: macos-latest
            platform_flag: --mac
            asset_globs: |
              dist/*.dmg
              dist/*-mac.zip
              dist/latest-mac*.yml
          - os: ubuntu-latest
            platform_flag: --linux
            asset_globs: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build Electron bundles
        run: npm run build

      - name: Package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Upload assets to GitHub Release (Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ${{ matrix.asset_globs }}
